[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riya-ai"
version = "0.1.0"
description = "RIYA - An offline-first, cross-platform personal AI assistant"
requires-python = ">=3.10"
authors = [
    { name = "Tularam" }
]

[tool.setuptools.packages.find]
include = ["core*"]